<style>
.places-index { padding: 120px 0 80px; }
.places-index h1 { font-family: "Playfair Display", serif; font-size: clamp(36px,5vw,52px); margin-bottom: 12px; }
.places-index .lead { color: #6e7773; margin-bottom: 36px; max-width: 560px; }
.place-index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.place-index-card { border-radius: 22px; overflow: hidden; background: white; border: 1px solid rgba(10,61,51,.08); box-shadow: 0 12px 40px rgba(10,61,51,.08); transition: transform .3s ease; text-decoration: none; color: inherit; display: block; }
.place-index-card:hover { transform: translateY(-4px); }
.place-index-card img { width: 100%; height: 180px; object-fit: cover; }
.place-index-card .body { padding: 18px; }
.place-index-card .body span { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #14765d; }
.place-index-card h2 { font-family: "Playfair Display", serif; font-size: 24px; margin: 6px 0; }
.place-index-card p { font-size: 13px; color: #6e7773; line-height: 1.5; }
</style>

<body class="place-page">
<header class="site-header v3-header place-header scrolled" id="siteHeader" style="background:rgba(255,253,248,.95);color:#17211e">
  <div class="container nav-wrap v3-nav-wrap">
    <a class="brand logo-brand v3-logo-brand" href="../index.html"><img class="logo-image" src="../ce-voyage-logo.webp" alt="Ce Voyage"/></a>
    <nav class="desktop-nav v3-desktop-nav"><a href="../index.html">Home</a><a href="../experiences/index.html">Experiences</a><a href="../guide.html">Travel Guide</a><a href="../tours.html">10-Day Tours</a>
      <a href="../vehicles.html">Vehicles</a>
      <a href="../team.html">Team</a><a class="nav-trip-link" href="../trip.html">My Trip <span class="trip-badge" data-trip-badge hidden>0</span></a><a href="../index.html#contact">Contact</a></nav>
  </div>
</header>
<section class="container places-index">
  <h1>Places to explore</h1>
  <p class="lead">Choose a destination, discover activities, and add them to your trip card.</p>
  <div class="place-index-grid" id="grid"></div>
</section>
<script src="../places-data.js"></script>
<script>
(function(){
  var grid = document.getElementById("grid");
  Object.keys(window.CE_PLACES || {}).forEach(function(id){
    var p = CE_PLACES[id];
    var a = document.createElement("a");
    a.className = "place-index-card";
    a.href = id + ".html";
    a.innerHTML = '<img alt=""/><div class="body"><span></span><h2></h2><p></p></div>';
    a.querySelector("img").src = p.hero;
    a.querySelector("img").alt = p.name;
    a.querySelector("span").textContent = p.tag;
    a.querySelector("h2").textContent = p.name;
    a.querySelector("p").textContent = p.tagline;
    grid.appendChild(a);
  });
})();
</script>
<script>
(function(){
  try {
    var n = JSON.parse(localStorage.getItem("cevoyage-trip") || "[]").length;
    document.querySelectorAll("[data-trip-badge]").forEach(function (b) {
      b.textContent = n;
      b.hidden = !n;
    });
  } catch (e) {}
})();
</script>
</body>
