<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0a3d33"/>
<title>Live | Ce Voyage</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Cormorant+Garamond:ital,wght@0,600;1,500&amp;display=swap" rel="stylesheet"/>
<link href="styles.css" rel="stylesheet"/>
<link href="live.css" rel="stylesheet"/>
<link rel="icon" href="favicon.ico"/>
</head>
<body class="live-page">
<header class="site-header v3-header scrolled" id="siteHeader">
  <div class="container nav-wrap v3-nav-wrap">
    <a class="brand logo-brand v3-logo-brand" href="index.html">
      <img class="logo-image" src="ce-voyage-logo.webp" alt="Ce Voyage"/>
    </a>
    <nav class="desktop-nav v3-desktop-nav">
      <a href="index.html">Home</a>
      <a href="live.html">Live</a>
      <a href="places/index.html">Places</a>
      <a href="tours.html">Tours</a>
    </nav>
    <div class="nav-actions">
      <a class="v3-header-cta" href="index.html#contact">Contact</a>
    </div>
  </div>
</header>

<main class="container">
  <div class="live-toolbar">
    <h1>Live from the island</h1>
    <button class="chip-btn live" type="button" id="openComposer">+ Upload</button>
    <a class="chip-btn" href="index.html">Home</a>
  </div>
  <p style="margin:-8px 0 18px;color:#6e7773;max-width:640px">Stories, photos, videos and blogs — Instagram-style. Use <strong>+ Upload</strong> on your phone to post a moment. Saved in this browser.</p>

  <form class="composer" id="liveComposer">
    <label>Type
      <select id="liveKind">
        <option value="story">Story (24h-style ring)</option>
        <option value="post">Feed post (photo / video)</option>
        <option value="blog">Blog article</option>
      </select>
    </label>
    <label>Title / place
      <input id="liveTitle" placeholder="Ella · Nine Arch" required/>
    </label>
    <label>Caption or article
      <textarea id="liveBody" rows="4" placeholder="What is happening now..."></textarea>
    </label>
    <label>Photo or video
      <input id="liveFile" type="file" accept="image/*,video/*"/>
    </label>
    <div class="row">
      <button class="chip-btn primary" type="submit">Publish</button>
    </div>
  </form>

  <div class="stories-strip" style="background:transparent;border:0;padding:0 0 18px">
    <div class="stories-row" id="liveStories"></div>
  </div>

  <div class="live-grid">
    <div>
      <h2 style="font-family:Cormorant Garamond,serif;color:#0a3d33;margin:0 0 12px">Feed</h2>
      <div id="liveFeed"></div>
    </div>
    <div>
      <h2 style="font-family:Cormorant Garamond,serif;color:#0a3d33;margin:0 0 12px">Blogs</h2>
      <div id="liveBlogs"></div>
    </div>
  </div>
</main>

<div class="story-viewer" id="storyViewer">
  <button class="close" type="button" id="storyClose" aria-label="Close">×</button>
  <div class="story-progress" id="storyProgress"></div>
  <div class="media">
    <div class="story-hit" id="storyPrev"></div>
    <div class="story-hit next" id="storyNext"></div>
    <img id="storyMediaImg" alt=""/>
    <video id="storyMediaVideo" playsinline></video>
    <div class="cap" id="storyCaption"></div>
  </div>
</div>

<script src="live.js"></script>
</body>
</html>
